[package]
name = "perf-event"
version = "0.5.0"
description = "A Rust interface to Linux performance monitoring"
license = "MIT OR Apache-2.0"
authors = ["Jim Blandy <jimb@red-bean.com>"]
repository = "https://github.com/jimblandy/perf-event.git"
edition = "2018"
readme = "README.md"
documentation = "https://docs.rs/perf-event/"
keywords = ["linux", "perf"]
categories = [
    "development-tools::profiling",
    "hardware-support",
    "os::linux-apis"
]

[features]
default = []

# Enable syscall interception hooks for mock testing and logging.
#
# This feature is meant for internal use, and is not covered by the
# usual semver rules. New minor and patch releases of `perf-event` may
# make breaking changes to the API offered when this feature is
# enabled.
hooks = []

[dependencies]
bitflags = "2.9.0"
libc = "0.2"

[dependencies.perf-event-open-sys]
path = "../perf-event-open-sys"
version = "8.0"
